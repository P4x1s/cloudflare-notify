name: Deploy to Cloudflare Workers

# push 到 main 自动部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy worker.js
    runs-on: ubuntu-latest
    # 只在官方仓库跑，避免 fork 的 PR 拿到密钥
    if: github.repository_owner == 'P4x1s'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 官方流程要求 wrangler >= 4.109
      - name: Install wrangler
        run: npm install -g wrangler@^4.109.0

      - name: Verify wrangler version (>= 4.109)
        shell: bash
        run: |
          set -uo pipefail
          raw="$(wrangler --version 2>&1 || true)"
          echo "raw output: ${raw}"
          v="$(printf '%s' "${raw}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "${v}" ]; then
            echo "::error::无法从 wrangler --version 解析版本号"
            exit 1
          fi
          echo "wrangler version: ${v}"
          node -e '
            const v = process.argv[1];
            const [a,b,c] = v.split(".").map(Number);
            if (!(a > 4 || (a === 4 && (b > 109 || (b === 109 && c >= 0))))) {
              console.error("版本过低，需要 >= 4.109.0，实际 " + v);
              process.exit(1);
            }
            console.log("版本校验通过: " + v);
          ' "${v}"

      # 密钥只从 GitHub Secrets 读，绝不写进仓库或日志
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi

          # ── 关键：--keep-vars ────────────────────────────────
          # wrangler deploy 默认会「删除所有 Dashboard 上配置的变量」，
          # 再写入 wrangler.toml [vars] 里的那些。
          # 本项目的 SEND_TOKEN / READ_TOKEN / WECOM_WEBHOOK /
          # TURNSTILE_SECRET_KEY 都在 Dashboard 上，配置文件里没有，
          # 一旦被清空，登录与推送会立刻失效。
          # --keep-vars 让部署保留 Dashboard 上的变量与密钥。
          echo ">>> 使用 --keep-vars 保留 Dashboard 上的变量与 Secret"
          npx wrangler deploy --config wrangler.toml --keep-vars
          npx wrangler versions list | head -20

      # 部署后自检：确认 KV 绑定与关键 Secret 还在。
      # wrangler.toml 里刻意没写 [[kv_namespaces]]（KV id 是每账户独有的占位符），
      # 若 deploy 把 NOTIFICATIONS 绑定覆盖掉，消息存取会立刻失效。
      - name: 部署后自检（KV 绑定与 Secret）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过自检"
            exit 0
          fi
          echo "--- 绑定与变量 ---"
          npx wrangler deployments list 2>&1 | head -10 || true

          # 用 API 直接读当前 Worker 的绑定
          bindings="$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/cloudflare-notify/environments/production/bindings" || true)"
          echo "$bindings" | head -c 1200; echo

          if echo "$bindings" | grep -q '"name":"NOTIFICATIONS"'; then
            echo "::notice::KV 绑定 NOTIFICATIONS 仍在 ✓"
          else
            echo "::error::KV 绑定 NOTIFICATIONS 丢失！请到 Dashboard → Settings → Bindings → KV Namespace 重新添加（变量名填 NOTIFICATIONS）"
            echo "::error::在修复前，消息无法存取"
          fi

          echo "--- 已绑定的 Secret 名称 ---"
          npx wrangler secret list 2>&1 | head -20 || true

      - name: Smoke test (版本指纹)
        run: |
          echo "等待 Cloudflare 边缘生效..."
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' https://cloudflare-notify.com/ || echo 000)
            echo "attempt $i -> HTTP $code"
            if grep -q 'window.TS' /tmp/page.html; then
              echo "::notice::线上已包含 Turnstile 客户端脚本（v1.5+）✓"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::未能在线上页面检测到 v1.5 特征串，请手动核对 Dashboard → Deployments"
