name: Deploy to Cloudflare Workers

# push 到 main 自动部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy worker.js
    runs-on: ubuntu-latest
    # 只在官方仓库跑，避免 fork 的 PR 拿到密钥
    if: github.repository_owner == 'P4x1s'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 官方流程要求 wrangler >= 4.109
      - name: Install wrangler
        run: npm install -g wrangler@4.163.0

      - name: Verify wrangler version
        run: |
          v="$(wrangler --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "wrangler version: $v"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit((a>4||(a===4&&(b>109||(b===109&&c>=0))))?0:1)" "$v"

      # 密钥只从 GitHub Secrets 读，绝不写进仓库或日志
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi
          # 部署前后都做一次版本指纹校验，确保新代码真的上了线
          npx wrangler deploy --config wrangler.toml
          npx wrangler versions list | head -20

      - name: Smoke test (版本指纹)
        run: |
          echo "等待 Cloudflare 边缘生效..."
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' https://ntfy.588816.xyz/ || echo 000)
            echo "attempt $i -> HTTP $code"
            if grep -q 'window.TS' /tmp/page.html; then
              echo "::notice::线上已包含 Turnstile 客户端脚本（v1.5+）✓"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::未能在线上页面检测到 v1.5 特征串，请手动核对 Dashboard → Deployments"
