name: Deploy to Cloudflare Workers

# push 到 main 自动部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy worker.js
    runs-on: ubuntu-latest
    # 只在官方仓库跑，避免 fork 的 PR 拿到密钥
    if: github.repository_owner == 'P4x1s'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 官方流程要求 wrangler >= 4.109
      - name: Install wrangler
        run: npm install -g wrangler@^4.109.0

      - name: Verify wrangler version (>= 4.109)
        shell: bash
        run: |
          set -uo pipefail
          raw="$(wrangler --version 2>&1 || true)"
          echo "raw output: ${raw}"
          v="$(printf '%s' "${raw}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "${v}" ]; then
            echo "::error::无法从 wrangler --version 解析版本号"
            exit 1
          fi
          echo "wrangler version: ${v}"
          node -e '
            const v = process.argv[1];
            const [a,b,c] = v.split(".").map(Number);
            if (!(a > 4 || (a === 4 && (b > 109 || (b === 109 && c >= 0))))) {
              console.error("版本过低，需要 >= 4.109.0，实际 " + v);
              process.exit(1);
            }
            console.log("版本校验通过: " + v);
          ' "${v}"

      # 密钥只从 GitHub Secrets 读，绝不写进仓库或日志
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi
          # 部署前后都做一次版本指纹校验，确保新代码真的上了线
          npx wrangler deploy --config wrangler.toml
          npx wrangler versions list | head -20

      # Turnstile 属于可选功能：site key 公开可放 vars，secret 必须由用户自己放进
      # Cloudflare Dashboard（或用 wrangler secret put）。这里只做「有没有配」的体检，
      # 不代替用户写入 secret —— secret 绝不能进仓库、也不进 Actions 日志。
      - name: Turnstile 状态体检（只读，不写入 secret）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过体检"
            exit 0
          fi
          echo "--- Worker 上已绑定的 Secret 名称 ---"
          npx wrangler secret list 2>&1 | head -20 || true
          if npx wrangler secret list 2>&1 | grep -q 'TURNSTILE_SECRET_KEY'; then
            echo "::notice::已绑定 TURNSTILE_SECRET_KEY ✓"
          else
            echo "::warning::未绑定 TURNSTILE_SECRET_KEY —— 若要启用人机验证，请在 Dashboard → Variables and Secrets 里添加"
          fi

      - name: Smoke test (版本指纹)
        run: |
          echo "等待 Cloudflare 边缘生效..."
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' https://ntfy.588816.xyz/ || echo 000)
            echo "attempt $i -> HTTP $code"
            if grep -q 'window.TS' /tmp/page.html; then
              echo "::notice::线上已包含 Turnstile 客户端脚本（v1.5+）✓"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::未能在线上页面检测到 v1.5 特征串，请手动核对 Dashboard → Deployments"
