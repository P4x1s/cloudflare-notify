#: Cloudflare Workers 配置（GitHub 导入专用版）
#: 完整文档：https://developers.cloudflare.com/workers/wrangler/configuration/

#: 项目名称，同时决定默认 workers.dev 子域名前缀（若被占用 Cloudflare 会自动加后缀）
name = "cloudflare-notify"

#: Worker 入口文件（单文件版，全部逻辑与页面都在这一个文件里）
main = "worker.js"

#: 兼容性日期，固定 API 行为
compatibility_date = "2026-11-16"

#: 非敏感变量（密钥请到 Dashboard → Settings → Variables → Secrets 设置）
[vars]
APP_NAME = "Cloudflare Notify"

#: ─────────────────────────────────────────────────────────────
#: v2.0 可选变量（都有安全默认值，不填也能直接部署）
#: ─────────────────────────────────────────────────────────────
#: 消息自动过期天数，防止 KV 1GB 上限被历史消息占满（1~365，默认 90）
MESSAGE_TTL_DAYS = "90"
#: 发送限流：单 IP / 单密钥的每分钟、每天上限
SEND_RATE_PER_MIN = "60"
SEND_RATE_PER_DAY = "500"
KEY_RATE_PER_MIN = "120"
KEY_RATE_PER_DAY = "1000"
#: 入站 HMAC 签名密钥 INBOUND_SIGNING_SECRET 属于敏感信息，
#: 只能到 Dashboard → Settings → Variables → Secrets 添加，不要写进本文件。
#: 渠道 Webhook 从面板保存到 KV，无需在此配置。

#: ─────────────────────────────────────────────────────────────
#: RouterHook 传感器聚合 Durable Object（v1.8 新增）
#: 作用：高频 rh_* 传感器按设备独立聚合，固定 60 秒窗口生成一条汇总通知，
#:       避免逐条刷屏、避免企业微信被高频消息轰炸。
#: Worker 代码中通过 env.ROUTERHOOK_SENSOR.idFromName(设备标识) 访问。
#: Dashboard 部署：Settings → Bindings → Add → Durable Object →
#:       Variable name 填 ROUTERHOOK_SENSOR，Durable Object class 选 RouterHookSensorDO。
#:       ⚠ 若未绑定，传感器会降级为逐条即时通知（数据不丢失，但会刷屏）。
#: 聚合窗口：可选变量 ROUTERHOOK_WINDOW_SECONDS = 30 / 60 / 120（默认 60）。
#: ─────────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "ROUTERHOOK_SENSOR"
class_name = "RouterHookSensorDO"

#: Durable Object 迁移（首次部署必须保留；后续升级不要删除已有 tag）
#: 注意：部分账户（如本项目账户）已不支持旧式 new_classes，必须用 new_sqlite_classes。
#: Dashboard 在线部署时由平台自动处理迁移；wrangler 部署按此配置。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RouterHookSensorDO"]

#: ─────────────────────────────────────────────────────────────
#: KV 命名空间说明（重要）
#: 为了让「从 GitHub 导入 → 一次部署成功 → 页面能打开」，这里刻意
#: 不写 KV 绑定。KV 的 ID 是每人账户独有的占位符，若把假 ID 写进来，
#: 部署会直接失败（这也是页面打不开的常见原因之一）。
#:
#: 正确做法：部署成功后，到 Dashboard → 该 Worker → Settings →
#: Bindings → Add → KV Namespace，变量名填 NOTIFICATIONS。详见
#: GITHUB_DEPLOY.md 第 4 节。
#:
#: 如果你希望把绑定写进本文件（可选，便于版本管理），先创建 KV 拿到
#: ID，再取消下面这段注释并替换成你自己的 ID：
#:
#: [[kv_namespaces]]
#: binding = "NOTIFICATIONS"
#: id = "你的_namespace_ID"
#: preview_id = "你的_preview_ID"
#: ─────────────────────────────────────────────────────────────
